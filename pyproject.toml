[project]
name = "financial-ap-ds-rebuild"
version = "0.1.0"
description = "Financial Accounts Payable Late Payment & Cashflow Data Science Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pandera>=0.20.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
